name: Deploy All Slides

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        slide:
          - name: digital-knowlege
            repo: iach526526/digital-knowlege
            path: .
          - name: ubuntu-release-party-2026
            repo: iach526526/ubuntu-release-party-2026
            path: ubuntu-party-2026

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.slide.repo }}
          path: slides/${{ matrix.slide.name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        working-directory: slides/${{ matrix.slide.name }}/${{ matrix.slide.path }}
        run: npm install

      - name: Build ${{ matrix.slide.name }}
        working-directory: slides/${{ matrix.slide.name }}/${{ matrix.slide.path }}
        run: npm run build -- --base /${{ matrix.slide.name }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slide.name }}-dist
          path: slides/${{ matrix.slide.name }}/${{ matrix.slide.path }}/dist

  combine:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Combine artifacts
        run: |
          mkdir -p dist
          for artifact in artifacts/*-dist; do
            name=$(basename "$artifact" -dist)
            mkdir -p "dist/$name"
            cp -r "$artifact/dist/." "dist/$name/" 2>/dev/null || true
          done
          cp index.html dist/
          echo 'slide.iach.cc' > dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: combine
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    name: Deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
